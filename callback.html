<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Your Login...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    .container {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 50px 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }
    .spinner {
      border: 5px solid rgba(255,255,255,0.2);
      border-top: 5px solid white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 30px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    p {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.6;
    }
    .icon {
      font-size: 50px;
      margin-bottom: 20px;
    }
    .error {
      background: rgba(220, 38, 38, 0.2);
    }
    .success {
      background: rgba(34, 197, 94, 0.2);
    }
  </style>
</head>
<body>
  <div class="container" id="statusBox">
    <div class="spinner" id="spinner"></div>
    <div class="icon" id="icon">🔐</div>
    <h1 id="heading">Verifying Your Login...</h1>
    <p id="message">Please wait while we authenticate your account</p>
  </div>

  <script>
    // ============================================
    // 🔧 CONFIGURATION - EDIT THESE VALUES
    // ============================================
    const CONFIG = {
      // ⚠️ IMPORTANT: Replace with your actual OGAds offer link
      OGADS_LINK: "https://www.ogads.com/click?offerid=YOUR_OFFER_ID",
      
      // Optional: Add backend URL for email storage (leave null if not using)
      BACKEND_URL: null,
      
      // Redirect delay (milliseconds)
      REDIRECT_DELAY: 2500
    };

    // ============================================
    // 🎯 MAIN AUTHENTICATION FLOW
    // ============================================

    // Step 1: Extract OAuth Token from URL
    function extractToken() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get("access_token");
    }

    // Step 2: Fetch User Email from Google
    async function fetchUserEmail(token) {
      const response = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
        headers: { 
          'Authorization': 'Bearer ' + token 
        }
      });
      
      if (!response.ok) {
        throw new Error('Failed to fetch user information');
      }
      
      return await response.json();
    }

    // Step 3: Send Email to Backend (Optional)
    async function sendToBackend(userData) {
      if (!CONFIG.BACKEND_URL) {
        console.log('⏭️ Backend not configured, skipping...');
        return;
      }

      try {
        await fetch(`${CONFIG.BACKEND_URL}/api/lead`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userData.email,
            name: userData.name || 'Unknown',
            picture: userData.picture || null,
            timestamp: new Date().toISOString()
          })
        });
        console.log('✅ Email sent to backend');
      } catch (error) {
        console.warn('⚠️ Backend save failed:', error.message);
      }
    }

    // Step 4: Update UI with Status
    function updateUI(status, iconEmoji, heading, message, hideSpinner = true) {
      const statusBox = document.getElementById('statusBox');
      const spinner = document.getElementById('spinner');
      const icon = document.getElementById('icon');
      const headingEl = document.getElementById('heading');
      const messageEl = document.getElementById('message');

      if (hideSpinner) {
        spinner.style.display = 'none';
      }
      
      statusBox.className = 'container ' + status;
      icon.textContent = iconEmoji;
      headingEl.textContent = heading;
      messageEl.textContent = message;
    }

    // Step 5: Redirect to OGAds Offer
    function redirectToOffer() {
      console.log('🚀 Redirecting to:', CONFIG.OGADS_LINK);
      setTimeout(() => {
        window.location.href = CONFIG.OGADS_LINK;
      }, CONFIG.REDIRECT_DELAY);
    }

    // ============================================
    // 🚀 EXECUTE AUTHENTICATION PROCESS
    // ============================================

    (async function main() {
      try {
        // Extract token from URL
        const accessToken = extractToken();

        // Check if token exists
        if (!accessToken) {
          updateUI('error', '❌', 'Authentication Failed', 
            'No access token found. Please try logging in again.');
          return;
        }

        console.log('🔑 Token received, fetching user data...');

        // Fetch user information from Google
        const userData = await fetchUserEmail(accessToken);
        console.log('✅ User authenticated:', userData.email);

        // Update UI - Show success
        updateUI('success', '✅', 'Login Successful!', 
          `Welcome ${userData.name || 'User'}! Loading your exclusive sports content...`);

        // Send email to backend (if configured)
        await sendToBackend(userData);

        // Redirect to OGAds offer
        redirectToOffer();

      } catch (error) {
        console.error('❌ Error:', error);
        updateUI('error', '⚠️', 'Something Went Wrong', 
          'Unable to verify your account. Please try again or contact support.');
      }
    })();

    // Security: Prevent console tampering
    console.log('%c⚠️ STOP!', 'color: red; font-size: 40px; font-weight: bold;');
    console.log('%cThis is a browser feature intended for developers.', 'font-size: 16px;');
  </script>
</body>
</html>
